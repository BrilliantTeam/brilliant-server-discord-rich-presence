name: 編譯所有版本並發佈到 Releases
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出儲存庫
        uses: actions/checkout@v4

      - name: 設置 JDK 21 / 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: 設置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 編譯 1.21.x 版本
        run: |
          chmod +x gradlew
          ./gradlew :1.21.1:build :1.21.2:build :1.21.3:build :1.21.4:build :1.21.5:build :1.21.6:build :1.21.7:build :1.21.8:build :1.21.9:build :1.21.10:build :1.21.11:build --continue

      - name: 編譯 26.x 版本
        run: |
          ./gradlew --stop
          ./gradlew :26.1:build :26.1.1:build :26.1.2:build :26.2:build --continue

      - name: 收集 jar 檔
        run: |
          mkdir -p release
          for v in 1.21.1 1.21.2 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11 26.1 26.1.1 26.1.2 26.2; do
            cp "versions/$v/build/libs/"*"+$v.jar" release/
          done
          ls -la release/

      - name: 發佈並上傳 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          name: Version ${{ github.run_number }} | ${{ github.event.head_commit.message }}
          body: |
            支援 Minecraft ` 1.21.1 ` ~ ` 26.2 `，請在 **Assets** 區塊下載跟自己遊戲版本對應的 jar 檔安裝。

            另需要對應版本的 [Fabric Loader](https://fabricmc.net/use/installer/) 與 [Fabric API](https://modrinth.com/mod/fabric-api)。

            Copyright © 輝煌伺服器 Brilliant Minecraft Server 版權所有 All rights reserved
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release/*.jar
